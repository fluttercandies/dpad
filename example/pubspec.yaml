name: dpad_example
description: A Netflix-style Flutter TV app showcasing the dpad package.
version: 3.0.0
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  dpad:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'
  flutter_cockpit_test: ^4.11.1

flutter:
  uses-material-design: true
