name: dpad
description: >-
  Production-grade D-pad navigation for Flutter TV apps. Focus regions with
  memory, TV-correct directional traversal, focus effects and remote-key
  handling.
version: 3.1.0
homepage: https://github.com/fluttercandies/dpad
repository: https://github.com/fluttercandies/dpad
issue_tracker: https://github.com/fluttercandies/dpad/issues
documentation: https://github.com/fluttercandies/dpad

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=4.0.0 <7.0.0'

topics:
  - android-tv
  - dpad-navigation
  - focus-management
  - fire-tv
  - apple-tv

screenshots:
  - description: The dpad logo
    path: dpad.png
